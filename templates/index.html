<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rural Welfare Advisor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 400: '#34d399', 500: '#10b981', 600: '#059669' } }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(75, 85, 99, 0.5); border-radius: 4px; }
        .fade-out { opacity: 0; transform: translateY(10px); pointer-events: none; transition: all 0.3s ease; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-gray-800 via-gray-900 to-black text-gray-100 h-screen flex flex-col antialiased">

    <header class="fixed top-0 w-full z-50 bg-gray-900/70 backdrop-blur-md border-b border-gray-700/50 shadow-sm">
        <div class="max-w-4xl mx-auto w-full flex justify-between items-center p-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center shadow-lg shadow-brand-500/20">
                    <span class="text-xl">🇮🇳</span>
                </div>
                <div>
                    <h1 class="text-lg font-semibold tracking-wide text-white leading-tight">Rural Welfare AI</h1>
                    <p class="text-xs text-brand-400 font-medium">Govt. Scheme Advisor</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <select id="language-select" class="bg-gray-800/80 text-sm text-gray-200 border border-gray-600 hover:border-brand-500 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-1 focus:ring-brand-500 transition-colors">
                    <option value="English">English</option>
                    <option value="Hindi">हिन्दी (Hindi)</option>
                    <option value="Telugu">తెలుగు (Telugu)</option>
                </select>

                <button onclick="clearChat()" class="text-sm text-gray-400 hover:text-white transition-all flex items-center gap-1.5 bg-gray-800/50 hover:bg-red-500/20 border border-gray-700 hover:border-red-500/50 px-3 py-2 rounded-lg group">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 group-hover:text-red-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    Reset
                </button>
            </div>
        </div>
    </header>

    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-6 max-w-4xl mx-auto w-full pt-28 pb-48">
        <div id="welcome-message" class="flex gap-4 items-start animate-slide-up">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-gray-700 to-gray-800 border border-gray-600 flex items-center justify-center flex-shrink-0 shadow-md">
                <svg class="w-6 h-6 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </div>
            <div class="bg-gray-800/80 backdrop-blur-sm rounded-2xl rounded-tl-sm px-5 py-4 max-w-[85%] shadow-lg border border-gray-700/50">
                <p class="text-gray-200 leading-relaxed">Namaste! Describe your current situation (e.g., age, education, location), and I will find the right government schemes for you.</p>
            </div>
        </div>
    </main>

    <footer class="fixed bottom-0 w-full bg-gradient-to-t from-black via-gray-900/95 to-transparent pt-8 pb-6 px-4 z-40">
        <div class="max-w-4xl mx-auto relative flex flex-col gap-4">
            
            <div id="quick-actions" class="flex flex-wrap gap-2 justify-center transition-all duration-300">
                <button onclick="sendQuickAction('I am a farmer with 1 hectare of land.')" class="bg-gray-800/80 backdrop-blur-md border border-gray-600/50 hover:border-brand-500 hover:bg-gray-700/80 text-sm px-4 py-2 rounded-full transition-all text-gray-300 shadow-sm hover:shadow-brand-500/20">
                    🌾 Small Farmer
                </button>
                <button onclick="sendQuickAction('I am an 18-year-old student looking for skill training.')" class="bg-gray-800/80 backdrop-blur-md border border-gray-600/50 hover:border-brand-500 hover:bg-gray-700/80 text-sm px-4 py-2 rounded-full transition-all text-gray-300 shadow-sm hover:shadow-brand-500/20">
                    🎓 Student Skilling
                </button>
                <button onclick="sendQuickAction('I am a 65-year-old widow looking for pension help.')" class="bg-gray-800/80 backdrop-blur-md border border-gray-600/50 hover:border-brand-500 hover:bg-gray-700/80 text-sm px-4 py-2 rounded-full transition-all text-gray-300 shadow-sm hover:shadow-brand-500/20">
                    👵 Senior Pension
                </button>
            </div>

            <div class="relative group">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-brand-500 to-blue-500 rounded-full blur opacity-20 group-hover:opacity-40 transition duration-500"></div>
                <input type="text" id="user-input" 
                    class="relative w-full bg-gray-900 border border-gray-700 text-white rounded-full pl-6 pr-14 py-4 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all shadow-2xl placeholder-gray-500"
                    placeholder="Ask about a scheme or describe yourself..."
                    onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" 
                    class="absolute right-2 top-2 bottom-2 bg-brand-600 hover:bg-brand-500 text-white rounded-full p-3 transition-colors flex items-center justify-center shadow-lg shadow-brand-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 0l-3 3a1 1 0 001.414 1.414L9 9.414V13a1 1 0 102 0V9.414l1.293 1.293a1 1 0 001.414-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </div>
    </footer>

    <script>
        let chatHistory = [];
        const chatBox = document.getElementById('chat-box');
        const inputField = document.getElementById('user-input');
        const quickActions = document.getElementById('quick-actions');
        const welcomeMessageHTML = document.getElementById('welcome-message').outerHTML;

        function clearChat() {
            chatHistory = []; 
            chatBox.innerHTML = welcomeMessageHTML; 
            quickActions.classList.remove('fade-out'); 
            inputField.value = '';
        }

        function sendQuickAction(text) {
            inputField.value = text;
            sendMessage();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            // GRAB THE SELECTED LANGUAGE
            const selectedLanguage = document.getElementById('language-select').value;

            quickActions.classList.add('fade-out');
            appendMessage(text, 'user');
            inputField.value = '';

            const loadingId = 'loading-' + Date.now();
            appendLoading(loadingId);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        query: text, 
                        history: chatHistory,
                        language: selectedLanguage // SEND IT TO BACKEND
                    })
                });
                
                const data = await response.json();
                
                document.getElementById(loadingId).remove();
                appendMessage(data.answer, 'bot');
                
                chatHistory.push({ role: 'user', content: text });
                chatHistory.push({ role: 'assistant', content: data.answer });
                
                if (chatHistory.length > 8) chatHistory = chatHistory.slice(-8);

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage("Connection error. Ensure the FastAPI server is running.", 'bot');
            }
        }

        function appendMessage(content, sender) {
            const div = document.createElement('div');
            div.className = `flex gap-4 items-start animate-slide-up ${sender === 'user' ? 'flex-row-reverse' : ''}`;
            
            const avatar = sender === 'user' 
                ? `<div class="w-10 h-10 rounded-xl bg-blue-600 border border-blue-500 flex items-center justify-center flex-shrink-0 shadow-md font-semibold text-white">U</div>`
                : `<div class="w-10 h-10 rounded-xl bg-gradient-to-br from-gray-700 to-gray-800 border border-gray-600 flex items-center justify-center flex-shrink-0 shadow-md"><svg class="w-6 h-6 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg></div>`;
            
            const bubbleClass = sender === 'user'
                ? 'bg-gradient-to-br from-blue-600 to-blue-700 text-white rounded-2xl rounded-tr-sm px-5 py-4 max-w-[85%] shadow-lg border border-blue-500/50'
                : 'bg-gray-800/80 backdrop-blur-sm text-gray-200 rounded-2xl rounded-tl-sm px-5 py-4 max-w-[85%] shadow-lg border border-gray-700/50 prose prose-invert prose-p:leading-relaxed prose-a:text-brand-400';
            
            const parsedContent = sender === 'bot' ? marked.parse(content) : content;
            div.innerHTML = `${avatar}<div class="${bubbleClass}">${parsedContent}</div>`;
            chatBox.appendChild(div);
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function appendLoading(id) {
            const div = document.createElement('div');
            div.id = id;
            div.className = "flex gap-4 items-start animate-slide-up";
            div.innerHTML = `
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-gray-700 to-gray-800 border border-gray-600 flex items-center justify-center flex-shrink-0 shadow-md">
                    <svg class="w-6 h-6 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                </div>
                <div class="bg-gray-800/80 backdrop-blur-sm rounded-2xl rounded-tl-sm px-5 py-5 shadow-lg border border-gray-700/50 flex items-center gap-2">
                    <div class="w-2.5 h-2.5 bg-brand-500 rounded-full animate-bounce"></div>
                    <div class="w-2.5 h-2.5 bg-brand-500 rounded-full animate-bounce" style="animation-delay: 0.15s"></div>
                    <div class="w-2.5 h-2.5 bg-brand-500 rounded-full animate-bounce" style="animation-delay: 0.3s"></div>
                </div>
            `;
            chatBox.appendChild(div);
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
